# Example bootstrap scenario.
#
# Boot Lightning into this exact state with:
#
#   bin/e2e start --scenario example
#
# (or `--scenario /abs/path/to/this.yaml`). Every key not marked "required"
# has a sensible default — see scenarios/README.md for the full reference.
# Re-running the same scenario is idempotent: records get deterministic ids
# derived from their names and are upserted, not duplicated.

users:
  - email: owner@openfn.org
    first_name: Olivia
    last_name: Owner
    api_token: true # generated (or reused) and surfaced in the manifest
    # password defaults to "welcome12345"
  - email: editor@openfn.org
    first_name: Esther
    last_name: Editor
  - email: super@openfn.org
    first_name: Sizwe
    last_name: Super
    superuser: true

credentials:
  - name: example-raw
    owner: owner@openfn.org
    schema: raw
    body:
      apiKey: not-a-real-key
      # secrets can come from the environment: apiKey: ${env:MY_API_KEY}

projects:
  - name: example-project
    members:
      - { email: owner@openfn.org, role: owner }
      - { email: editor@openfn.org, role: editor }
    workflows:
      - name: Example Workflow
        trigger:
          type: webhook
          # any Trigger field passes through, e.g.:
          # webhook_reply: after_completion
        jobs:
          - name: Transform data
            adaptor: "@openfn/language-common@latest"
            credential: example-raw
            body: |
              fn(state => {
                console.log('transforming');
                return state;
              });
          - name: Upload result
            adaptor: "@openfn/language-common@latest"
        edges:
          - { from: trigger, to: Transform data, condition: always }
          - {
              from: Transform data,
              to: Upload result,
              condition: on_job_success,
            }
