# Caching reverse proxy for the Lightning.Adaptors.* upstreams.
#
# Driven by bin/adaptor_cache; see README.md in this directory for the why and
# the env vars to export.
services:
  nginx:
    image: nginx:1.27.4-alpine
    container_name: adaptor-cache
    ports:
      - '127.0.0.1:${ADAPTOR_CACHE_PORT:-4874}:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Named volume, so `docker compose down` keeps the cache; only
      # `bin/adaptor_cache purge` drops it.
      - adaptor-cache-data:/var/cache/nginx/adaptors
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1/_healthz']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s

volumes:
  adaptor-cache-data: {}
