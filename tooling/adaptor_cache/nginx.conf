# Caching reverse proxy for the three Lightning.Adaptors.* upstreams.
#
# Point Lightning at it with:
#   export ADAPTOR_REGISTRY_URL=http://localhost:4874/npm
#   export ADAPTOR_JSDELIVR_URL=http://localhost:4874/jsdelivr
#   export ADAPTOR_GITHUB_URL=http://localhost:4874/github
#
# Workers run as root deliberately. The cache lives on a Docker named volume
# mounted at /var/cache/nginx/adaptors, which Docker creates root-owned; the
# image's default `nginx` worker user could not write into it and every request
# would log a permission error and bypass the cache. This is a local dev tool
# bound to 127.0.0.1, so root workers are an acceptable trade for not needing
# an entrypoint chown.
user root;
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
  worker_connections 256;
}

http {
  default_type application/octet-stream;

  # $upstream_cache_status says whether a request was answered from disk (HIT)
  # or went out to the upstream (MISS, EXPIRED, REVALIDATED).
  # `bin/adaptor_cache check` parses it.
  log_format cache '$time_iso8601 status=$status cache=$upstream_cache_status '
                   '$request_method $request_uri';
  access_log /dev/stdout cache;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # Generous on purpose: nothing should be evicted mid-session, and the whole
  # @openfn/language-* corpus is a few hundred MB at worst.
  proxy_cache_path /var/cache/nginx/adaptors
                   levels=1:2
                   keys_zone=adaptors:64m
                   max_size=20g
                   inactive=30d
                   use_temp_path=off;

  proxy_http_version 1.1;

  # All three upstreams are SNI-dependent CDNs. Without proxy_ssl_server_name
  # the TLS handshake goes out with no server name and the upstream serves a
  # default cert or refuses outright. proxy_ssl_name defaults to $proxy_host,
  # which is the right value here.
  proxy_ssl_server_name on;

  proxy_cache adaptors;

  # Cache aggressively regardless of upstream freshness headers. npm sends
  # short max-age values and Set-Cookie; jsDelivr varies on Accept-Encoding.
  # This is a dev cache, so serving a stale body is fine.
  proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;

  proxy_cache_valid 200 301 302 7d;
  # 404s are frequent and expected: NPM.GitHub tries <shape>.png before
  # <shape>.svg, so every SVG-only adaptor produces a 404 on the png attempt.
  # Cache them so the fan-out is cheap, but briefly, so a newly-added icon
  # shows up the same day.
  proxy_cache_valid 404 10m;
  proxy_cache_valid any 1m;

  # One request per cache key reaches the upstream; the rest wait on it.
  # Without this, NPM.GitHub's icon fan-out opens as many upstream connections
  # as its max concurrency allows on a cold cache.
  proxy_cache_lock on;
  proxy_cache_lock_timeout 30s;

  # Offline: serve whatever is on disk when the upstream cannot be reached.
  proxy_cache_use_stale error timeout invalid_header updating
                        http_429 http_500 http_502 http_503 http_504;
  proxy_cache_background_update on;
  proxy_cache_revalidate on;

  # `always` matters for the 404s: add_header's default status list covers 2xx
  # and 3xx but not 404, and cached 404s are routine here because of the
  # png-then-svg icon fallback.
  add_header X-Cache-Status $upstream_cache_status always;
  add_header X-Adaptor-Cache-Upstream $proxy_host always;

  proxy_connect_timeout 10s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;

  server {
    listen 80;
    server_name _;

    location = /_healthz {
      access_log off;
      return 200 "ok\n";
    }

    # nginx does not merge proxy_set_header across configuration levels: the
    # moment a location declares one, every proxy_set_header from an enclosing
    # level is dropped. So each location below repeats the same three headers
    # rather than inheriting them, and Accept-Encoding must not be hoisted.
    #
    # Accept-Encoding is pinned to identity because Lightning's Tesla clients
    # have no decompress middleware and NPM.Schema takes sha256 over the raw
    # response bytes. If a gzip-capable client (curl --compressed) populated
    # the cache, replaying that entry to Lightning would give it the wrong
    # bytes and the wrong schema_sha256. Identity keeps every cached body
    # byte-identical for every client.

    # GET /npm/-/v1/search?text=@openfn&size=250
    # GET /npm/@openfn/language-http
    location /npm/ {
      proxy_set_header Host registry.npmjs.org;
      proxy_set_header Connection close;
      proxy_set_header Accept-Encoding "";
      # A literal hostname (not a variable) so nginx resolves it once at
      # startup from the container's resolver. Using a variable would require
      # a `resolver` directive and runtime DNS.
      proxy_pass https://registry.npmjs.org/;
    }

    # GET /jsdelivr/npm/<name>@<version>/configuration-schema.json
    location /jsdelivr/ {
      proxy_set_header Host cdn.jsdelivr.net;
      proxy_set_header Connection close;
      proxy_set_header Accept-Encoding "";
      proxy_pass https://cdn.jsdelivr.net/;
    }

    # GET /github/OpenFn/adaptors/<ref>/packages/<pkg>/assets/<shape>.<ext>
    #
    # The conditional-GET path still works through the cache. NPM.GitHub sends
    # if-none-match from the etag it stored last time and treats a 304 as
    # :not_modified. nginx caches the upstream 200 along with its ETag, and on
    # a hit its not-modified filter compares the client's If-None-Match against
    # that ETag and downgrades the 200 to a 304 itself. There is no upstream
    # hop, and Lightning's etag bookkeeping sees what GitHub would have sent.
    location /github/ {
      proxy_set_header Host raw.githubusercontent.com;
      proxy_set_header Connection close;
      proxy_set_header Accept-Encoding "";
      proxy_pass https://raw.githubusercontent.com/;
    }

    location / {
      return 404 "adaptor_cache: use /npm/, /jsdelivr/ or /github/\n";
    }
  }
}
